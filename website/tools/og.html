<!doctype html>
<!-- The link-preview picture (1200 x 630), rendered to website/img/og.png by
     tools/og.ps1 with a headless browser. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(900px 500px at 85% 110%, rgba(56, 225, 255, 0.22), transparent 60%),
                radial-gradient(700px 400px at 0% 0%, rgba(96, 165, 250, 0.16), transparent 60%), #0a0a0c;
    color: #e8eaf0; font-family: "Segoe UI", system-ui, sans-serif; position: relative;
  }
  .text { position: absolute; left: 72px; top: 78px; width: 520px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 84px; height: 84px; }
  .brand span { font-size: 58px; font-weight: 700; letter-spacing: -1.5px; }
  h1 { font-size: 34px; line-height: 1.25; margin: 34px 0 18px; font-weight: 600; color: #fff; }
  p { font-size: 23px; line-height: 1.45; margin: 0; color: #a3abbb; }
  .tags { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 10px; }
  .tags span { font-size: 19px; padding: 7px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.16); color: #cfd4de; }
  .tags span.free { color: #34d399; border-color: rgba(52, 211, 153, 0.5); }
  .shot { position: absolute; left: 640px; top: 96px; width: 760px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.16);
          box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 120px rgba(56, 225, 255, 0.15); }
</style>
</head>
<body>
  <div class="text">
    <div class="brand"><img src="../img/icon-512.png" alt=""><span>Submarine</span></div>
    <h1>SSH, SFTP, RDP, VNC and Telnet in one encrypted app</h1>
    <p>Windows · macOS · Linux · Android</p>
    <div class="tags"><span class="free">Free &amp; open source</span><span>No ads</span><span>No tracking</span></div>
  </div>
  <img class="shot" src="../img/hero-1600.webp" alt="">
</body>
</html>
