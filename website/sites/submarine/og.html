<!doctype html>
<!-- The link-preview picture (1200 x 630), rendered to img/og.png with a
     headless browser (see the README). Not part of the site itself. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(700px 420px at 90% 100%, rgba(167, 139, 250, 0.28), transparent 65%),
                radial-gradient(700px 420px at 0% 0%, rgba(34, 211, 238, 0.22), transparent 65%), #04070f;
    color: #e7edf6; font-family: "Inter", "Segoe UI", system-ui, sans-serif; position: relative;
  }
  .text { position: absolute; left: 70px; top: 74px; width: 540px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 80px; height: 80px; }
  .brand span { font-size: 56px; font-weight: 800; letter-spacing: -2px; }

  h1 em { font-style: normal; background: linear-gradient(100deg, #22d3ee, #a78bfa); -webkit-background-clip: text; color: transparent; }
  p { font-size: 23px; line-height: 1.45; margin: 0; color: #95a3b8; }
  .tags { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 10px; }
  .tags span { font-size: 19px; padding: 7px 15px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.16); color: #c6d0de; }
  .tags span.free { color: #34d399; border-color: rgba(52, 211, 153, 0.5); }
  .shot { position: absolute; left: 650px; top: 92px; width: 760px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.18);
          box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 120px rgba(34, 211, 238, 0.18); }
</style>
</head>
<body>
  <div class="text">
    <div class="brand"><img src="img/icon-512.png" alt=""><span>Submarine</span></div>
    <h1>SSH, SFTP, RDP, VNC and Telnet in <em>one encrypted app</em></h1>

  </div>

</body>
</html>
