name: Release

# Fires when you push a tag like v0.1.0. The job builds Submarine on
# Windows and Ubuntu (and Android, and iOS + macOS in apple.yml), stamps the
# tag's version into Cargo.toml and tauri.conf.json so the bundled binary's
# version matches the tag, and uploads the installers/bundles as a draft
# GitHub Release. The iOS and Mac App Store builds go to App Store Connect.
#
# Triggering a release: locally run
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"
  # Manual button on the Actions tab — useful for sanity checks without
  # cutting a real release. Choose any version string; nothing is published
  # unless `publish_release` is true.
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.1.0); at least 0.0.1, which is the lowest an Android package may have"
        required: true
        default: "v0.0.1-test"
      publish_release:
        description: "Attach artifacts to a GitHub Release"
        required: false
        default: "false"

# Least privilege by default: the build and android jobs only read the repo.
# Only the release job, which attaches artifacts to a GitHub Release, is given
# `contents: write` (on the job itself, below).
permissions:
  contents: read

# Faster, cheaper CI builds. Incremental compilation costs time + disk in
# clean-checkout environments where there's nothing to be incremental
# against; -D warnings would be great here but breaks too many crates,
# so leave at default.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: "always"
  RUST_BACKTRACE: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: ships .msi (WiX) and .exe (NSIS). Both let the user
          # double-click to install with no extra friction.
          - platform: windows-latest
            os_name: windows
            bundles: "msi,nsis"
            rust_target: x86_64-pc-windows-msvc

          # macOS is built in apple.yml (the `apple` job below): one universal
          # app for Apple Silicon and Intel, signed and notarized.

          # Linux: ship four flavours so users on any major distro can
          # double-click an installer that matches their package manager:
          #   - .deb   → Debian / Ubuntu / Mint
          #   - .rpm   → Fedora / RHEL / openSUSE
          #   - .AppImage → distro-agnostic, no install required
          # And a separate Arch step further down produces .pkg.tar.zst
          # via makepkg inside an Arch Docker container (Tauri's bundler
          # has no native Arch backend).
          - platform: ubuntu-22.04
            os_name: linux-x64
            bundles: "deb,rpm,appimage"
            rust_target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # Don't leave the checkout token in .git/config where a later build
        # step (or a compromised dependency) could use it — nothing here pushes.
        with:
          persist-credentials: false

      # Compute the version string we'll stamp into Cargo.toml and
      # tauri.conf.json. For tag pushes we use the tag (strip the leading
      # 'v'); for manual runs we use the workflow input. The result is
      # exposed to later steps via $GITHUB_ENV.
      - name: Resolve version
        shell: bash
        # The version comes in through the environment, not spliced into the
        # script with ${{ }} — a value like `; rm -rf …` would otherwise run
        # as part of this step. It's then checked against a version shape
        # before it's used to stamp files.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RAW="$INPUT_VERSION"
          else
            RAW="$REF_NAME"
          fi
          if ! printf '%s' "$RAW" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.+-]+)?$'; then
            echo "Refusing an unexpected version string: $RAW" >&2
            exit 1
          fi
          # Strip leading "v" — Cargo + Tauri want bare semver.
          VERSION="${RAW#v}"
          # Strict-semver form: everything from the first '-' stripped.
          # Windows MSI (WiX) rejects non-numeric pre-release identifiers
          # (`optional pre-release identifier in app version must be
          # numeric-only`), and Arch's makepkg rejects hyphens in pkgver
          # outright. Both fall back to this shortened string for
          # stamping / pkgver; the other targets (Android, macOS, .deb,
          # .rpm, AppImage, NSIS) still see the full string so a dev
          # build's artefacts self-identify as e.g. "0.2.37-dev".
          VERSION_STRICT="${VERSION%%-*}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_STRICT=$VERSION_STRICT" >> "$GITHUB_ENV"
          echo "Resolved release version: $VERSION (strict: $VERSION_STRICT)"

      # Stamp the version into Cargo.toml and tauri.conf.json so the
      # bundled binary's about/version metadata matches the git tag.
      # Without this, a v0.2.0 tag would still produce installers
      # showing "0.1.0" inside Windows Add/Remove Programs and macOS's
      # Get Info pane. Uses Node to avoid the cross-platform sed/awk
      # quoting maze.
      - name: Stamp version into manifests
        shell: bash
        run: |
          # Windows bundles MSI in the same job as NSIS; MSI requires
          # a strict semver (no non-numeric pre-release) so we stamp
          # the sanitised form for the whole Windows job. Other
          # platforms keep the full string.
          if [[ "${{ matrix.bundles }}" == *msi* ]]; then
            STAMP="$VERSION_STRICT"
          else
            STAMP="$VERSION"
          fi
          echo "Stamping manifests with $STAMP"
          STAMP_VERSION="$STAMP" node -e "
            const fs=require('fs');
            const v=process.env.STAMP_VERSION;
            // Cargo.toml: only the package.version line — leave dep versions alone.
            const cargo=fs.readFileSync('src-tauri/Cargo.toml','utf8');
            const next=cargo.replace(/^version *= *\".*\"/m, 'version = \"'+v+'\"');
            fs.writeFileSync('src-tauri/Cargo.toml', next);
            // tauri.conf.json: top-level version key.
            const conf=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));
            conf.version=v;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2)+'\n');
            console.log('Stamped version', v);
          "

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the stable branch, as of 2026-10-20
        with:
          # Named here: the action takes it from its ref otherwise ("stable"
          # was the ref), and a commit SHA says nothing.
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      # Linux-only: WebKit + AppImage tooling + rpmbuild. The Tauri Linux
      # build links webkit2gtk-4.1, ships an AppImage built via
      # `linuxdeploy` (needs librsvg + libsoup3), and now also produces an
      # .rpm which requires the `rpm` package's `rpmbuild` binary.
      - name: Install Linux deps
        if: matrix.os_name == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf \
            file \
            rpm

      - name: Install npm deps
        run: npm ci

      # We deliberately do NOT run `npm run build` here — tauri-action
      # invokes the `beforeBuildCommand` defined in tauri.conf.json
      # (which is `npm run build`) before the Rust build, so a manual
      # invocation would just duplicate work and risk version drift
      # between the two passes.
      - name: Build Tauri bundles
        # Pinned to a commit (v0.6.2): a moving tag would let a compromised
        # release of the action change what is built and attached.
        # russh >= 0.63 implements RSA / legacy DH / SHA-1 MACs in pure
        # Rust, so release and local builds share one algorithm set and no
        # OpenSSL (or Perl) is needed anymore.
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        with:
          args: --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }}

      # Arch: Tauri's bundler has no native pacman backend, so we run
      # makepkg ourselves inside an `archlinux:latest` container. The
      # PKGBUILD in packaging/arch/ installs the already-built Tauri
      # release binary plus a .desktop and icon from $startdir — no
      # source download / no rebuild — so the result is the same binary
      # users get from the .deb, just packaged for pacman. Compression
      # stays at pacman's default (zstd at level 19, what every Arch
      # mirror uses) — no custom XZ / no MAKEPKG_CONF tweaks.
      - name: Build Arch package
        if: matrix.os_name == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p arch-build
          cp packaging/arch/PKGBUILD             arch-build/
          cp packaging/arch/submarine.desktop    arch-build/
          cp src-tauri/target/${{ matrix.rust_target }}/release/submarine arch-build/
          cp src-tauri/icons/icon.png            arch-build/

          # Run makepkg in a throwaway Arch container. base-devel pulls in
          # fakeroot/binutils/etc; we create an unprivileged build user
          # because makepkg refuses to run as root. --skipinteg because
          # the PKGBUILD has no source= entries (everything is local).
          # --nodeps because the depends=() are RUNTIME-only (webkit2gtk-
          # 4.1 / gtk3 / libsoup3 — what the user's machine needs to
          # actually launch the app). package() doesn't compile or link
          # anything; it just installs the already-built Tauri binary +
          # .desktop + icon, so the dep check in the build container
          # would only force us to download those packages for nothing.
          # Arch's pkgver forbids hyphens (and colons, slashes, spaces).
          # For a dev / rc / beta release the version we WANT to stamp
          # is "0.2.37-dev" but pkgver has to be "0.2.37" or makepkg
          # rejects the PKGBUILD with `pkgver is not allowed to contain
          # colons, forward slashes, hyphens or whitespace`. Passing
          # VERSION_STRICT keeps the pkg name usable; the file name
          # inside the artefact bundle still says v${VERSION} because
          # we compose that from $VERSION (with the pre-release intact)
          # elsewhere in the workflow.
          docker run --rm \
            -v "$PWD/arch-build:/build" \
            -w /build \
            -e VERSION="$VERSION_STRICT" \
            archlinux:latest \
            bash -c '
              set -e
              pacman -Syu --noconfirm --needed base-devel sudo
              useradd -m b
              echo "b ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
              chown -R b:b /build
              sudo -u b sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD
              sudo -u b makepkg -f --noconfirm --skipinteg --nodeps
            '

      # Collect every artifact this job produced into one folder for upload.
      - name: Stage artifacts (Windows)
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-ChildItem -Path "src-tauri/target/${{ matrix.rust_target }}/release/bundle" -Recurse -Include *.msi,*.exe |
            Copy-Item -Destination artifacts/

      # Portable build (#35): the bare exe alongside an empty submarine-data
      # folder — that folder is the switch that makes Submarine keep all of its
      # data there instead of %APPDATA% (see src-tauri/src/portable.rs). .NET's
      # ZipFile records the empty folder as an entry, so it survives the round
      # trip and the extracted copy is portable out of the box.
      - name: Zip Windows portable build
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          $stage = New-Item -ItemType Directory -Force -Path portable-build
          New-Item -ItemType Directory -Force -Path (Join-Path $stage.FullName submarine-data) | Out-Null
          Copy-Item "src-tauri/target/${{ matrix.rust_target }}/release/submarine.exe" $stage.FullName
          Copy-Item packaging/windows/README-portable.txt (Join-Path $stage.FullName README.txt)
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Join-Path (Resolve-Path artifacts).Path "Submarine-v${{ env.VERSION }}-windows-x64-portable.zip"
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stage.FullName, $zip)

      - name: Stage artifacts (Linux)
        if: matrix.os_name == 'linux-x64'
        run: |
          mkdir -p artifacts
          # Tauri bundles land in target/.../release/bundle/{deb,rpm,appimage}/.
          # Arch .pkg.tar.zst is in arch-build/ from the previous step.
          find "src-tauri/target/${{ matrix.rust_target }}/release/bundle" \
            \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) \
            -exec cp {} artifacts/ \;
          find arch-build -maxdepth 1 -name "*.pkg.tar.zst" -exec cp {} artifacts/ \;
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: submarine-${{ matrix.os_name }}
          path: artifacts/*
          if-no-files-found: error

  # Android: separate job because the setup (JDK 17 + Android SDK/NDK +
  # cargo-ndk + Android Rust targets) is wholly different from the
  # desktop matrix. Produces the UNSIGNED universal release APK.
  #
  # Signing is a separate job (`android-sign`, below). This job runs the whole
  # toolchain of the app (npm and vite plugins, every crate's build.rs and
  # proc macros, cargo-ndk, Gradle plugins), any of which could read a key
  # that is in its environment or on its disk. So no signing secret is given
  # to it: build.gradle.kts finds no SUBMARINE_KEYSTORE_* and leaves the
  # release APK unsigned, and the job that holds the keystore only signs.
  android:
    runs-on: ubuntu-22.04
    env:
      # The NDK this job installs and builds with (the runner image has its
      # own, newer one as ANDROID_NDK_ROOT).
      NDK_VERSION: "27.1.12297006"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # Nothing here pushes — see the build job.
        with:
          persist-credentials: false

      - name: Resolve version
        shell: bash
        # Through the environment and checked for shape — see the build job.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RAW="$INPUT_VERSION"
          else
            RAW="$REF_NAME"
          fi
          if ! printf '%s' "$RAW" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.+-]+)?$'; then
            echo "Refusing an unexpected version string: $RAW" >&2
            exit 1
          fi
          VERSION="${RAW#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Stamp version into manifests
        shell: bash
        run: |
          node -e "
            const fs=require('fs');
            const v=process.env.VERSION;
            const cargo=fs.readFileSync('src-tauri/Cargo.toml','utf8');
            const next=cargo.replace(/^version *= *\".*\"/m, 'version = \"'+v+'\"');
            fs.writeFileSync('src-tauri/Cargo.toml', next);
            const conf=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));
            conf.version=v;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2)+'\n');
          "

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;${{ env.NDK_VERSION }}"

      # Every later step uses that NDK. The runner's ANDROID_NDK_ROOT is a
      # machine variable, which `${{ env.ANDROID_NDK_ROOT }}` doesn't see:
      # the APK step got an empty NDK_HOME ("Android NDK invalid"), and the
      # symlinks below went into the runner's own NDK. Written to
      # GITHUB_ENV, it is the job's for both.
      - name: Use the installed NDK
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [ ! -f "$NDK/source.properties" ]; then
            echo "::error::NDK $NDK_VERSION not found at $NDK"
            exit 1
          fi
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "Using the NDK at $NDK"

      - name: Install Rust with Android targets
        # Only the two ABIs that ship in real Android phones — aarch64
        # (modern arm64) and armv7 (older 32-bit arm). x86 / x86_64 are
        # emulator-only and we explicitly drop them to keep APKs lean.
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the stable branch, as of 2026-10-20
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: android

      - name: Install cargo-ndk
        # A version, not whatever is newest on the day: this tool runs in the job
        # that builds the APK.
        run: cargo install cargo-ndk --locked --version 4.1.2

      # Some C build scripts in the tree (cc-rs driven, e.g. ring / zstd /
      # sqlite) may spawn binutils via the legacy `<target>-ranlib` /
      # `<target>-ar` / `<target>-strip` names. NDK 27 ships only the
      # unprefixed `llvm-ranlib` / `llvm-ar` (the prefixed symlinks were
      # dropped around NDK 23), which surfaces as "<target>-ranlib: not
      # found" and make exiting 127.
      #
      # Create the missing prefixed symlinks inside the NDK's bin dir, then
      # add that dir to $GITHUB_PATH so any cc-rs-driven build can spawn
      # them by name. Both Rust targets (aarch64-linux-android,
      # armv7-linux-androideabi) get their full set.
      - name: Symlink legacy binutils names for NDK cross-compile
        run: |
          NDK_BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [ ! -d "$NDK_BIN" ]; then
            echo "::error::NDK bin dir not found at $NDK_BIN"
            exit 1
          fi
          for target in aarch64-linux-android armv7a-linux-androideabi arm-linux-androideabi; do
            for tool in ranlib ar strip nm objcopy objdump readelf; do
              link="$NDK_BIN/${target}-${tool}"
              if [ ! -e "$link" ]; then
                ln -sf "$NDK_BIN/llvm-${tool}" "$link"
              fi
            done
          done
          echo "$NDK_BIN" >> "$GITHUB_PATH"
          ls -la "$NDK_BIN" | grep -E '(ranlib|ar|strip)$' | head -20

      - name: Install npm deps
        run: npm ci

      # Universal APK — single .apk users sideload from GitHub. Split APKs
      # were tried in v0.2.18/v0.2.19 but Android rejects them as "invalid
      # package" when installed standalone because split APKs need their
      # matching base.apk installed at the same time (the Play Store
      # mechanism). For direct sideload only a universal APK works.
      #
      # AAB was dropped in v0.2.30 — we don't ship through Google Play, so
      # the .aab artifact was dead weight (users can't sideload it) and
      # doubled the Android build time on CI. If Play Store distribution
      # becomes a goal later, re-add `android:build:aab` to package.json
      # and the matching find/copy loop here.
      #
      # No signing secret in this step or this job (see the comment on the
      # job): Gradle leaves the release APK unsigned.
      - name: Build Android APK
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        run: npm run android:build

      - name: Stage the unsigned APK
        shell: bash
        run: |
          mkdir -p artifacts
          # APKs land under app/build/outputs/apk/<abi>/release/*-release-unsigned.apk
          # when Gradle has no keystore. Renamed to carry the version, so the
          # release asset names are readable.
          shopt -s nullglob
          found=0
          for apk in $(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*-release-unsigned.apk"); do
            base="$(basename "$apk" .apk)"
            cp "$apk" "artifacts/Submarine-v${{ env.VERSION }}-${base}.apk"
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No unsigned release APK was produced."
            exit 1
          fi
          # A signed one here would mean this job had a keystore after all.
          if find src-tauri/gen/android/app/build/outputs/apk -type f -name "*-release.apk" | grep -q .; then
            echo "::error::A signed APK came out of the build job, which must not have a keystore."
            exit 1
          fi
          ls -la artifacts/

      - name: Upload the unsigned APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: submarine-android-unsigned
          path: artifacts/*
          if-no-files-found: error

  # Signs the APK the `android` job built, and nothing else. The only job that
  # holds the release keystore, and all it runs is apksigner (from the runner
  # image's Android SDK) on one file: none of the app's build scripts, crates or
  # plugins run here, so none of them can read the key.
  #
  # The keystore is base64 in the SUBMARINE_KEYSTORE_B64 secret, with
  # SUBMARINE_KEYSTORE_PASSWORD, SUBMARINE_KEY_ALIAS and SUBMARINE_KEY_PASSWORD.
  # A missing secret fails the job loudly: an unsigned APK is a file Android
  # rejects at install ("package appears to be invalid"). Signed with v1, v2
  # and v3 as build.gradle.kts did (v4 off: it needs a side file that
  # standalone sideloading doesn't use).
  android-sign:
    needs: android
    runs-on: ubuntu-22.04
    steps:
      - name: Download the unsigned APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: submarine-android-unsigned
          path: unsigned

      - name: Sign and verify
        shell: bash
        env:
          SUBMARINE_KEYSTORE_B64: ${{ secrets.SUBMARINE_KEYSTORE_B64 }}
          SUBMARINE_KEYSTORE_PASSWORD: ${{ secrets.SUBMARINE_KEYSTORE_PASSWORD }}
          SUBMARINE_KEY_ALIAS: ${{ secrets.SUBMARINE_KEY_ALIAS }}
          SUBMARINE_KEY_PASSWORD: ${{ secrets.SUBMARINE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "$SUBMARINE_KEYSTORE_B64" ]      && missing+=("SUBMARINE_KEYSTORE_B64")
          [ -z "$SUBMARINE_KEYSTORE_PASSWORD" ] && missing+=("SUBMARINE_KEYSTORE_PASSWORD")
          [ -z "$SUBMARINE_KEY_ALIAS" ]         && missing+=("SUBMARINE_KEY_ALIAS")
          [ -z "$SUBMARINE_KEY_PASSWORD" ]      && missing+=("SUBMARINE_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub Secrets required for signing: ${missing[*]}"
            echo "::error::Add them at https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          tools="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apksigner="$tools/apksigner"
          zipalign="$tools/zipalign"
          if [ ! -x "$apksigner" ] || [ ! -x "$zipalign" ]; then
            echo "::error::apksigner / zipalign not found under $sdk/build-tools"
            exit 1
          fi
          echo "Using $tools"
          umask 077
          ks="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$ks"' EXIT
          echo "$SUBMARINE_KEYSTORE_B64" | base64 -d > "$ks"
          if [ ! -s "$ks" ]; then
            echo "::error::SUBMARINE_KEYSTORE_B64 decoded to an empty file — verify the secret is valid base64."
            exit 1
          fi
          mkdir -p artifacts
          shopt -s nullglob
          found=0
          for apk in unsigned/*-unsigned.apk; do
            name="$(basename "$apk")"
            out="artifacts/${name%-unsigned.apk}.apk"
            # Gradle aligns what it writes; a signature over a file that isn't
            # would break the alignment later, so check it first.
            "$zipalign" -c 4 "$apk"
            "$apksigner" sign \
              --ks "$ks" --ks-key-alias "$SUBMARINE_KEY_ALIAS" \
              --ks-pass env:SUBMARINE_KEYSTORE_PASSWORD --key-pass env:SUBMARINE_KEY_PASSWORD \
              --min-sdk-version 24 \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false \
              --out "$out" "$apk"
            echo "--- apksigner verify $out ---"
            "$apksigner" verify --verbose --print-certs "$out"
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No unsigned APK to sign."
            exit 1
          fi
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: submarine-android
          path: artifacts/*
          if-no-files-found: error

  # iOS and macOS (apple.yml): the signed, notarized Mac download comes back
  # here as the `submarine-macos` artifact; the iOS and Mac App Store builds
  # are uploaded to App Store Connect when this is a release.
  apple:
    uses: ./.github/workflows/apple.yml
    with:
      version: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
      upload: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true' }}
    secrets: inherit

  # Gather every platform's artifacts and attach them to a GitHub Release.
  # Skips when triggered via workflow_dispatch unless `publish_release=true`.
  release:
    needs: [build, android-sign, apple]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
    # Only this job writes: it attaches the built artifacts to the Release.
    permissions:
      contents: write
    steps:
      # Resolve the tag string used for the GitHub Release. For tag pushes
      # this is github.ref_name (already "vX.Y.Z"). For workflow_dispatch,
      # github.ref_name resolves to the BRANCH ("main"), which would
      # produce a "Submarine main" release and move the `main` tag — so
      # fall back to the user-supplied version input. Normalize to a
      # leading `v` so the tag/name is uniform regardless of what the
      # user typed.
      - name: Resolve release tag
        id: tag
        shell: bash
        # Through the environment and checked for shape — see the build job.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RAW="$INPUT_VERSION"
          else
            RAW="$REF_NAME"
          fi
          if ! printf '%s' "$RAW" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.+-]+)?$'; then
            echo "Refusing an unexpected version string: $RAW" >&2
            exit 1
          fi
          case "$RAW" in v*) TAG="$RAW";; *) TAG="v$RAW";; esac
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist

      - name: Flatten into a single folder
        run: |
          mkdir -p release-files
          find dist -type f \( \
            -name "*.msi" -o -name "*.exe" -o -name "*-portable.zip" \
            -o -name "*.dmg" -o -name "*.app.zip" \
            -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \
            -o -name "*.pkg.tar.zst" \
            -o -name "*.apk" \
            \) -exec cp {} release-files/ \;
          # The unsigned APK is only the signing job's input.
          rm -f release-files/*-unsigned.apk
          ls -la release-files/

      # What the files were when they were attached: to check a download against.
      - name: Checksums
        run: |
          cd release-files
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: Submarine ${{ steps.tag.outputs.TAG }}
          draft: true
          generate_release_notes: true
          files: release-files/*
