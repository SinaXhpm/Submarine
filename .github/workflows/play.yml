name: Google Play

# Builds the Android App Bundle for Google Play, signs it with the release key,
# and sends it to a Play testing track. By hand only, from the Actions tab.
#
# Three jobs, each holding only what it needs (as release.yml's Android jobs):
#   bundle  builds the AAB with the app's whole toolchain and no secret;
#   sign    signs it with the release key, running nothing but jarsigner;
#   upload  sends it with the Play service account, running one script that
#           uses only Node's own modules (scripts/play-upload.mjs).
# Google re-signs what it delivers with the app signing key (Play App
# Signing), the same key as the APKs on GitHub, so the two can update each
# other. Play registered that key as the upload key too, so the bundle is
# signed with it (no separate upload key).
#
# The Play build has no GitHub update check (the `app-store` feature, as for
# the Mac App Store): Google Play's rules allow updates only through Play.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.5.0-beta.3)"
        required: true
      track:
        description: "Play track: internal testing, alpha = closed testing, beta = open testing; none = build and sign only"
        type: choice
        options: [internal, alpha, beta, none]
        default: internal
      status:
        description: "draft while the app has never been published (then roll it out in Play Console); completed after that"
        type: choice
        options: [draft, completed]
        default: draft
      notes:
        description: "Release notes in English, up to 500 characters (optional)"
        required: false
        default: ""

permissions:
  contents: read

# One upload at a time: Play allows one open edit per app.
concurrency:
  group: google-play
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: "always"
  RUST_BACKTRACE: "1"

jobs:
  bundle:
    runs-on: ubuntu-22.04
    env:
      # The same NDK as release.yml's android job (r28+: 16 KB pages).
      NDK_VERSION: "28.2.13676358"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve version
        shell: bash
        # Through the environment and checked for shape, as in release.yml.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          RAW="$INPUT_VERSION"
          if ! printf '%s' "$RAW" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.+-]+)?$'; then
            echo "Refusing an unexpected version string: $RAW" >&2
            exit 1
          fi
          echo "VERSION=${RAW#v}" >> "$GITHUB_ENV"

      - name: Stamp version into manifests
        shell: bash
        run: |
          node -e "
            const fs=require('fs');
            const v=process.env.VERSION;
            const cargo=fs.readFileSync('src-tauri/Cargo.toml','utf8');
            fs.writeFileSync('src-tauri/Cargo.toml', cargo.replace(/^version *= *\".*\"/m, 'version = \"'+v+'\"'));
            const conf=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));
            conf.version=v;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2)+'\n');
          "
          node scripts/android-version-code.mjs "$VERSION" --stamp src-tauri/tauri.conf.json

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;${{ env.NDK_VERSION }}"

      # As in release.yml: the job's NDK through GITHUB_ENV.
      - name: Use the installed NDK
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [ ! -f "$NDK/source.properties" ]; then
            echo "::error::NDK $NDK_VERSION not found at $NDK"
            exit 1
          fi
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

      - name: Install Rust with Android targets
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the stable branch, as of 2026-10-20
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: android-play

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version 4.1.2

      # The legacy `<target>-ranlib` / `-ar` names some cc-rs build scripts
      # spawn (see release.yml).
      - name: Symlink legacy binutils names for NDK cross-compile
        run: |
          NDK_BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [ ! -d "$NDK_BIN" ]; then
            echo "::error::NDK bin dir not found at $NDK_BIN"
            exit 1
          fi
          for target in aarch64-linux-android armv7a-linux-androideabi arm-linux-androideabi; do
            for tool in ranlib ar strip nm objcopy objdump readelf; do
              link="$NDK_BIN/${target}-${tool}"
              [ -e "$link" ] || ln -sf "$NDK_BIN/llvm-${tool}" "$link"
            done
          done
          echo "$NDK_BIN" >> "$GITHUB_PATH"

      - name: Install npm deps
        run: npm ci

      # No signing secret in this job: Gradle leaves the bundle unsigned.
      - name: Build the App Bundle
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        run: npm run android:build:play

      - name: Stage the unsigned bundle
        shell: bash
        run: |
          mkdir -p artifacts
          mapfile -t found < <(find src-tauri/gen/android/app/build/outputs/bundle -type f -name "*-release.aab")
          if [ "${#found[@]}" -ne 1 ]; then
            echo "::error::Expected one release bundle, found ${#found[@]}: ${found[*]}"
            exit 1
          fi
          # A signature here would mean this job had a key after all.
          if unzip -Z1 "${found[0]}" | grep -Eq '^META-INF/[^/]+\.(RSA|DSA|EC|SF)$'; then
            echo "::error::The bundle came out signed, but this job must not have a key."
            exit 1
          fi
          cp "${found[0]}" "artifacts/Submarine-v${VERSION}-play-unsigned.aab"
          ls -la artifacts/

      - name: Check 16 KB page alignment
        run: node scripts/check-android-16k.mjs artifacts/*.aab

      - name: Upload the unsigned bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: submarine-play-unsigned
          path: artifacts/*
          if-no-files-found: error

  # Signs the bundle with the release key, and nothing else: none of the app's
  # build scripts, crates or plugins run here. The key is the one release.yml
  # signs the APKs with: base64 in SUBMARINE_KEYSTORE_B64, with
  # SUBMARINE_KEYSTORE_PASSWORD, SUBMARINE_KEY_ALIAS and SUBMARINE_KEY_PASSWORD.
  # An App Bundle is signed with jarsigner (apksigner signs APKs only).
  sign:
    needs: bundle
    runs-on: ubuntu-22.04
    steps:
      - name: Download the unsigned bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: submarine-play-unsigned
          path: unsigned

      - name: Sign and verify
        shell: bash
        env:
          SUBMARINE_KEYSTORE_B64: ${{ secrets.SUBMARINE_KEYSTORE_B64 }}
          SUBMARINE_KEYSTORE_PASSWORD: ${{ secrets.SUBMARINE_KEYSTORE_PASSWORD }}
          SUBMARINE_KEY_ALIAS: ${{ secrets.SUBMARINE_KEY_ALIAS }}
          SUBMARINE_KEY_PASSWORD: ${{ secrets.SUBMARINE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "$SUBMARINE_KEYSTORE_B64" ]      && missing+=("SUBMARINE_KEYSTORE_B64")
          [ -z "$SUBMARINE_KEYSTORE_PASSWORD" ] && missing+=("SUBMARINE_KEYSTORE_PASSWORD")
          [ -z "$SUBMARINE_KEY_ALIAS" ]         && missing+=("SUBMARINE_KEY_ALIAS")
          [ -z "$SUBMARINE_KEY_PASSWORD" ]      && missing+=("SUBMARINE_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub Secrets for the release key: ${missing[*]}"
            exit 1
          fi
          jarsigner="${JAVA_HOME:?}/bin/jarsigner"
          keytool="${JAVA_HOME:?}/bin/keytool"
          umask 077
          ks="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$ks"' EXIT
          echo "$SUBMARINE_KEYSTORE_B64" | base64 -d > "$ks"
          if [ ! -s "$ks" ]; then
            echo "::error::SUBMARINE_KEYSTORE_B64 decoded to an empty file."
            exit 1
          fi
          mkdir -p artifacts
          in="$(ls unsigned/*-play-unsigned.aab)"
          out="artifacts/$(basename "${in%-unsigned.aab}").aab"
          "$jarsigner" -keystore "$ks" \
            -storepass:env SUBMARINE_KEYSTORE_PASSWORD -keypass:env SUBMARINE_KEY_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -signedjar "$out" "$in" "$SUBMARINE_KEY_ALIAS"
          "$jarsigner" -verify "$out" | tee "$RUNNER_TEMP/verify.txt"
          grep -q "jar verified" "$RUNNER_TEMP/verify.txt"
          # The certificate's fingerprint (public): Play Console shows the one
          # it expects under App integrity (E9:E3:50:DC ... AE:66:9F:1C).
          "$keytool" -printcert -jarfile "$out" | grep -E "SHA256:|Owner:" | sed 's/Owner:.*/Owner: (shown in Play Console)/'
          ls -la artifacts/

      - name: Upload the signed bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: submarine-play
          path: artifacts/*
          if-no-files-found: error

  # Sends the signed bundle to the chosen track. The service account's JSON
  # key is in PLAY_SERVICE_ACCOUNT_JSON; it needs release rights on this app
  # in Play Console (Users and permissions).
  upload:
    needs: sign
    if: inputs.track != 'none'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Download the signed bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: submarine-play
          path: signed

      - name: Send it to Google Play
        shell: bash
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          INPUT_VERSION: ${{ inputs.version }}
          TRACK: ${{ inputs.track }}
          STATUS: ${{ inputs.status }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing GitHub Secret PLAY_SERVICE_ACCOUNT_JSON."
            exit 1
          fi
          args=(--package com.submarine.app --aab "$(ls signed/*.aab)" --track "$TRACK" --status "$STATUS" --name "${INPUT_VERSION#v}")
          if [ -n "$NOTES" ]; then
            printf '%s' "$NOTES" > "$RUNNER_TEMP/notes.txt"
            args+=(--notes "$RUNNER_TEMP/notes.txt")
          fi
          node scripts/play-upload.mjs "${args[@]}"
