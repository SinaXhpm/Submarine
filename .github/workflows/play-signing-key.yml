name: Play app signing key

# Once, before the first upload to Google Play: hands Play App Signing the
# key the GitHub APKs are signed with, so Play's installs and the APKs from
# GitHub can update each other. The key is in the SUBMARINE_KEYSTORE_* secrets
# (as for release.yml's android-sign job). Google's own tool (PEPK) encrypts
# it with the public key Play Console gives on the app's page: Test and
# release > App integrity > App signing > "Export and upload a key from Java
# keystore" > "Download encryption public key". Only Google can open the
# result; upload it on that same page. By hand only, from the Actions tab.
# Delete this file once Play shows the key as the app signing key.
on:
  workflow_dispatch:
    inputs:
      encryption_public_key:
        description: "The text of Play Console's encryption_public_key.pem (the BEGIN/END lines may be left out)"
        required: true

permissions:
  contents: read

jobs:
  export:
    # The key is encrypted for whoever's public key the run is given, so only
    # the repository's owner may start it.
    if: github.actor == github.repository_owner
    runs-on: ubuntu-22.04
    steps:
      - name: Install JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      # The input is only a public key: checked for shape and read with openssl;
      # its fingerprint goes to the log, to compare with the downloaded file.
      - name: Read Google's encryption key
        shell: bash
        env:
          INPUT_KEY: ${{ inputs.encryption_public_key }}
        run: |
          set -euo pipefail
          b64=$(printf '%s' "$INPUT_KEY" | sed -e 's/-----[A-Z ]*-----//g' | tr -d ' \r\n\t')
          if ! printf '%s' "$b64" | grep -Eq '^[A-Za-z0-9+/]{80,}={0,2}$'; then
            echo "::error::That is not the text of a PEM public key."
            exit 1
          fi
          pem="$RUNNER_TEMP/play-encryption-key.pem"
          { echo "-----BEGIN PUBLIC KEY-----"; printf '%s\n' "$b64" | fold -w 64; echo "-----END PUBLIC KEY-----"; } > "$pem"
          # sed reads all of it: an early-closing head could fail the step under pipefail
          openssl pkey -pubin -in "$pem" -noout -text | sed -n 1p
          echo "SHA-256 of the key: $(openssl pkey -pubin -in "$pem" -outform DER | sha256sum | cut -d' ' -f1)"

      # Pinned: a changed tool fails here until its new checksum is reviewed.
      - name: Download PEPK
        shell: bash
        env:
          PEPK_SHA256: aaccc0774b240aa5304bdad2a49865e92f229ca73209ecb6eaafe75dc858e24e
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/pepk.jar" \
            https://www.gstatic.com/play-apps-publisher-rapid/signing-tool/prod/pepk.jar
          echo "$PEPK_SHA256  $RUNNER_TEMP/pepk.jar" | sha256sum -c -

      - name: Export the key, encrypted for Google
        shell: bash
        env:
          SUBMARINE_KEYSTORE_B64: ${{ secrets.SUBMARINE_KEYSTORE_B64 }}
          SUBMARINE_KEYSTORE_PASSWORD: ${{ secrets.SUBMARINE_KEYSTORE_PASSWORD }}
          SUBMARINE_KEY_ALIAS: ${{ secrets.SUBMARINE_KEY_ALIAS }}
          SUBMARINE_KEY_PASSWORD: ${{ secrets.SUBMARINE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "$SUBMARINE_KEYSTORE_B64" ]      && missing+=("SUBMARINE_KEYSTORE_B64")
          [ -z "$SUBMARINE_KEYSTORE_PASSWORD" ] && missing+=("SUBMARINE_KEYSTORE_PASSWORD")
          [ -z "$SUBMARINE_KEY_ALIAS" ]         && missing+=("SUBMARINE_KEY_ALIAS")
          [ -z "$SUBMARINE_KEY_PASSWORD" ]      && missing+=("SUBMARINE_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub Secrets for the release key: ${missing[*]}"
            exit 1
          fi
          umask 077
          ks="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$ks"' EXIT
          echo "$SUBMARINE_KEYSTORE_B64" | base64 -d > "$ks"
          # The certificate (public): its SHA-256 must be the one README gives
          # for the GitHub APKs, e9:e3:50:dc ... ae:66:9f:1c.
          keytool -list -v -keystore "$ks" -storepass:env SUBMARINE_KEYSTORE_PASSWORD \
            -alias "$SUBMARINE_KEY_ALIAS" | grep -E "SHA256:"
          mkdir -p out
          java -jar "$RUNNER_TEMP/pepk.jar" --keystore="$ks" --alias="$SUBMARINE_KEY_ALIAS" \
            --keystore-pass="$SUBMARINE_KEYSTORE_PASSWORD" --key-pass="$SUBMARINE_KEY_PASSWORD" \
            --output=out/submarine-app-signing-key.zip --include-cert \
            --rsa-aes-encryption --encryption-key-path="$RUNNER_TEMP/play-encryption-key.pem"
          unzip -l out/submarine-app-signing-key.zip

      - name: Upload the encrypted key
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: submarine-app-signing-key-for-play
          path: out/*
          retention-days: 1
          if-no-files-found: error
