<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="493" height="58" viewBox="0 0 493 58">
  <!-- The .msi's other pages: a 493 x 58 banner. Windows Installer writes the
       page's title and description in black over its left part. -->
