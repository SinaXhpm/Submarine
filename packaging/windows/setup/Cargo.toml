[package]
name = "submarine-setup"
# Not the product version: the installer reads that from src-tauri/tauri.conf.json.
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Submarine's Windows installer and uninstaller"
publish = false

# Its own workspace: it builds after the app, with the app's exe inside.
[workspace]

[lib]
name = "setup_core"
path = "src/lib.rs"

[[bin]]
name = "setup"
path = "src/bin/setup.rs"

[[bin]]
name = "uninstall"
path = "src/bin/uninstall.rs"

[dependencies]
brotli-decompressor = "6.0.1"
serde_json = "1"
sha2 = "0.10.9"
tao = "=0.37.1"
windows-registry = "0.6.1"
wry = { version = "=0.57.0", default-features = false, features = ["os-webview"] }

[dependencies.windows]
version = "0.62.2"
features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_Security_WinTrust",
  "Win32_Storage_EnhancedStorage",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Com_Urlmon",
  "Win32_System_Console",
  "Win32_System_Environment",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_RestartManager",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
]

[features]
# Test builds only: a DevTools port, a window position and a language from
# the environment (SUBMARINE_SETUP_CDP, _POS, _LANG). Releases never have it.
lab = []

[build-dependencies]
brotli = "9.0.0"
embed-resource = "3.0.11"
serde_json = "1"
sha2 = "0.10.9"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# build.rs packs the app with brotli: unoptimized, that alone takes many minutes.
[profile.release.build-override]
opt-level = 3

[profile.dev.build-override]
opt-level = 3
