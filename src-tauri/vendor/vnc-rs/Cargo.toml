[package]
edition = "2021"
name = "vnc-rs"
version = "0.6.0"
authors = [
    "Jovi Hsu <jv.hsu@outlook.com>",
    "Petr Beneš <petr.benes@gendigital.com>",
    "Djamel TORCHE <djamel.torche@gmail.com>",
    "Peter Rekdal Khan-Sunde <peter.sunde@gmail.com>",
]
description = "An async implementation of VNC client side protocol"
homepage = "https://github.com/HsuJv/vnc-rs"
readme = "README.md"
keywords = ["vnc"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/HsuJv/vnc-rs"
publish = false

[lib]
name = "vnc"
path = "src/lib.rs"

[dependencies]
async_io_stream = "0.3"
flate2 = "^1"
futures = "0.3"
thiserror = "^1"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["compat"] }
tracing = { version = "^0.1", features = ["log"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "^1", features = ["full"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "^1", features = ["sync", "macros", "io-util", "rt", "time"] }
wasm-bindgen-futures = "0.4"
