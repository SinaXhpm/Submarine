[package]
name = "submarine"
version = "0.4.0"
description = "Submarine SSH Client"
authors = ["Sina Xhpm (sinaxhpm.com)"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

# Library + binary dual target. The Tauri Builder, command registry, and
# state setup live in `src/lib.rs::run()`. The bin entry point (`src/main.rs`)
# is a one-liner that calls `submarine_lib::run()` on desktop; on Android
# Tauri's `#[mobile_entry_point]` attr on `run()` generates the JNI glue and
# the bin is never built. `cdylib` is what Gradle dlopens from the APK.
[lib]
name = "submarine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

# Compile crypto + compression dependencies with full optimization even
# in `cargo build` (debug). Without this, `npm run tauri dev` runs the
# Argon2 KDF unoptimised — vault unlock takes 5-10x longer (1.5-3 s vs
# 200-400 ms) because the inner mixing loops aren't vectorised. The
# rest of our own code stays debug-buildable, so iteration speed and
# panic-on-overflow assertions are unaffected.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
[profile.dev.package.zstd-safe]
opt-level = 3
[profile.dev.package.zstd-sys]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[dependencies]
# 2.12 is the first release with `app > appDirectoriesOverride`, which portable
# mode uses to re-root every app directory — and, through app_local_data_dir,
# the webview's data folder — into `submarine-data` (see src/portable.rs). This
# is already the version resolved in Cargo.lock, so it only raises the floor.
tauri = { version = "2.12", features = [] }
# tauri-plugin-opener replaces the `open` crate for URL opening — the latter
# is excluded on Android (no equivalent crate), so before this plugin the
# About-panel "open repo / website" buttons returned a literal "external
# URLs not wired on Android yet" error. The plugin bridges to ACTION_VIEW
# on Android and to xdg-open / open / start on desktop, so the same Rust
# call works everywhere. We keep `open` for file/folder open-with calls
# (Live Edit, Open in Explorer) which are desktop-only by design and
# already cfg-gated.
tauri-plugin-opener = "2"
hex = "0.4"
# Compact transport for coalesced terminal output over the Tauri event bridge
# (a raw Vec<u8> serializes as a ~4x-bloated JSON number array). Already in the
# dependency tree via tauri/russh, so this direct dep adds no new crate.
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
# TCP-level keepalive on the SSH transport sockets (poor-network resilience).
# Already in the tree transitively via tokio — a direct dep adds no new crates.
socket2 = "0.6"
rusqlite = { version = "0.40", features = ["bundled", "backup", "serialize", "functions"] }
argon2 = "0.6"
aes-gcm = "0.11"
# E2E profile sharing: X25519 sealed-box (ECIES) so a profile's data key can be
# handed to another member wrapped to their public key — the server never sees
# it. curve25519-dalek 5.x is already in the tree via ssh-key, so x25519-dalek 3
# adds no new curve impl. HKDF-SHA256 derives the AEAD key from the ECDH shared
# secret (sha2 is already a dep).
x25519-dalek = { version = "3", features = ["getrandom", "static_secrets"] }
hkdf = "0.13"
rand = "0.10"
directories = "6.0"
# russh >= 0.45 is pure Rust for the whole algorithm set (RSA host keys, all
# DH groups, HMAC-SHA1), so the old OpenSSL-backed `full-ssh-algos` feature and
# its Perl build requirement are gone. `ring` is picked as the crypto backend
# because it is already in the tree via rustls (aws-lc-rs would add a cmake /
# NASM build dependency on Windows for nothing).
russh = { version = "0.63", default-features = false, features = ["flate2", "ring", "rsa"] }
# Must be the exact version russh pins: the key types are shared between our
# key generation / validation code and russh's auth API.
ssh-key = { version = "=0.7.0-rc.11", features = ["alloc", "encryption", "ed25519", "rsa"] }
tokio-socks = "0.5"
async-http-proxy = { version = "1.2", features = ["runtime-tokio"] }
russh-sftp = "3"
notify = "8.2"
# Debounces filesystem events so we don't try to upload a file mid-write.
# Mirror watcher uses this — events for the same path within 500ms collapse
# to a single action, which both eliminates partial uploads and keeps
# rapid-fire editor saves (e.g. vim's swap-then-rename pattern) from
# generating spurious traffic. Pairs cleanly with the `notify` 8.x crate
# we already use elsewhere.
notify-debouncer-mini = "0.7"
# Used by the mirror module to stamp downloaded files with the remote's
# mtime. Without it, every freshly-downloaded file has local mtime = now,
# which would make the next dry-run treat the local copy as "newer" and
# offer to re-upload it back. set_file_mtime is a single syscall and
# `filetime` is the standard crate for it (works on Rust 1.70 — std::fs
# alternatives need 1.75+).
filetime = "0.2"
# Content-hash compare in the mirror's initial reconciliation. We trust
# size+mtime as a quick equality check (matching rsync's default), but
# when sizes match and mtimes drift we hash both sides and only count
# the files as different if the digests actually disagree. SHA-256 is
# overkill for a "same or not?" question but it's already pulled in
# transitively by russh/ssh-key, so making the dep explicit costs nothing.
sha2 = "0.11"
# known_hosts hashed host names: HMAC-SHA1 (known_hosts.rs); both already in the tree via russh.
hmac = "0.13"
sha1 = "0.11"
regex = "1.10"
# rustls-tls so we don't drag in OpenSSL on Windows builds. multipart for blob
# uploads; json for typed request/response bodies.
# socks and system-proxy: the sync server can be reached through a proxy
# (`cloud_config`), a SOCKS5 one included, and "system" means the OS's proxy
# settings, not only the proxy environment variables.
# gzip: answers come compressed when the server does that (the sync API, the
# update check); see cloud.rs for gzipped request bodies.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream", "socks", "system-proxy", "gzip"] }
# Vault v2 compresses the SQLite serialisation with zstd before encrypting.
# Real profiles compress ~50-70% (lots of repeated SQL+JSON structure), so
# both local disk and cloud blobs shrink correspondingly. v1 vaults stay
# readable — we only emit v2 going forward.
zstd = { version = "0.14", default-features = false }
# Archive and extract in the local file pane (the remote pane runs tar, zip
# and unzip on the server). tar 0.4.46 has the fixes for its link and PAX
# header advisories. flate2 and chrono are in the tree already: deflate for
# zip and gzip, and the local time a zip entry is stamped with.
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
tar = { version = "0.4.46", default-features = false }
flate2 = "1.1.10"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# Zeroize-on-drop wrappers for the master vault key and the decompressed
# SQLite plaintext. Without this, secrets stay in the heap until allocator
# reuse — long enough for a swap file / crash dump to capture them. We
# wrap only the things that survive past one function call; transient
# String/Vec passed as args to argon2/aes-gcm are zeroized internally by
# those crates.
zeroize = { version = "1.8", features = ["zeroize_derive"] }
vnc-rs = "0.6"
# The built-in RDP client (#3, rdp_client.rs): Devolutions' IronRDP
# (MIT/Apache-2.0). It runs here, in the backend, so the password (NLA
# through its sspi) and the check of the server's certificate never reach
# the webview. Its own TLS isn't used (its `upgrade` doesn't check
# certificates): the connection is upgraded with tokio-rustls on ring, both
# already in the tree, and the certificate is pinned the way SSH host keys
# are.
# Pinned to one IronRDP commit, not a release: no release works with russh
# yet (each pins pre-release curve25519 / ed25519 crates; their master moved
# to the finals). That's why the built-in client is offered as experimental,
# off unless chosen. Move to the first release that has it.
# `cliprdr`: the shared clipboard (text only: no files go through it).
# `rdpdr`: files shared with the server, a folder or a drive (rdp_share.rs).
ironrdp = { git = "https://github.com/Devolutions/IronRDP", rev = "62246b364a0282bab85087f658a81fe4207b6b31", default-features = false, features = ["core", "pdu", "connector", "session", "graphics", "input", "displaycontrol", "dvc", "svc", "cliprdr", "rdpdr"] }
ironrdp-tokio = { git = "https://github.com/Devolutions/IronRDP", rev = "62246b364a0282bab85087f658a81fe4207b6b31", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
x509-cert = { version = "0.3", default-features = false, features = ["std"] }

# ---------------------------------------------------------------------------
# Desktop-only deps. These crates either don't compile on Android at all
# (rfd — native file dialog) or have no meaningful mobile equivalent
# (tauri-plugin-window-state — mobile windows aren't resizable/movable;
# open — opening a file in the user's "default desktop app" doesn't map to
# Android's intent system). Their call sites in `lib.rs` and `about.rs` are
# wrapped in `#[cfg(not(target_os = "android"))]`, so the Android build
# doesn't need any of these to compile.
# ---------------------------------------------------------------------------
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-window-state = "2"
rfd = "0.17"
open = "5.1"
# Lists the fonts installed on this device for the terminal font picker. A
# webview can't enumerate system fonts (the Local Font Access API pops a
# permission prompt and doesn't exist on WebKitGTK or Android), so we read the
# OS font folders ourselves. Pure Rust: it only parses font name tables. Not
# on Android, which lists no installed fonts (see fonts.rs).
fontdb = "0.24"

# ---------------------------------------------------------------------------
# Linux-only. GTK's own crates, already in the build through Tauri (same
# versions, nothing new to download). lib.rs reads the clipboard through
# them for pastes into the terminal, because the webview can't be trusted
# with it there (#89, see `clipboard_read_text`).
# ---------------------------------------------------------------------------
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdk = "0.18"

# ---------------------------------------------------------------------------
# Windows-only. Windows Hello, to open a profile without typing its password
# when the user turns that on (#166, quick_unlock.rs): KeyCredentialManager
# keeps a key (in the TPM where there is one) that signs only after the
# user's PIN, face or finger. Already in the build through Tauri (same
# version, nothing new to download); these are its parts used here. Also
# DPAPI and WaitForInputIdle: Remote Desktop Connection gets the saved
# password in its .rdp file, encrypted for this Windows user, and the file
# goes once it has read it (rdp.rs, launch_rdp_app).
# ---------------------------------------------------------------------------
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Security_Credentials",
    "Security_Cryptography",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_TpmBaseServices",
    "Win32_UI_WindowsAndMessaging",
] }

# Files shared with an RDP server by the built-in client (rdp_share.rs):
# IronRDP's own drive backends, from the same pinned revision. On Windows it
# checks every path itself; on macOS and Linux rdp_share.rs checks them in
# front of it. A phone has none.
[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
ironrdp-rdpdr-native = { path = "vendor/ironrdp-rdpdr-native" }

[dev-dependencies]
# Tests only: a one-connection listener for russh's in-memory ssh-agent server
# (agent_auth tests). Already in the dependency tree through russh.
futures = "0.3"
